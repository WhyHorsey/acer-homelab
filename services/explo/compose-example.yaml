services:
  explo:
    image: ghcr.io/lumepart/explo:latest
    restart: unless-stopped
    container_name: explo
    ports:
      - "7288:7288"
    volumes:
      - ./explo/.env:/opt/explo/.env
      - ./explo/config:/opt/explo/config # required — stores playlist cache and cover art
      - ${EXPLO_MUSIC_PATH:?Set EXPLO_MUSIC_PATH in .env}:/data/ # has to be in the same path you have your music system pointed to (it's recommended to put explo under a subfolder)
      - ${SLSKD_DOWNLOADS_PATH:?Set SLSKD_DOWNLOADS_PATH in .env}:/slskd/ # if using slskd
      # - /path/to/lidarr/downloads:/lidarr/ # if using lidarr and moving tracks to Explo's subfolder is wanted
    environment:
      # User/group to run Explo as. Defaults to root (0:0) for backwards compatibility
      # Set these to the owner UID/GID of your music folder and Explo data folder for better permission handling
      # - PUID=0
      # - PGID=0
      - TZ=${TZ:-UTC} # Change this to the timezone set in ListenBrainz (default is UTC)
      - WEB_UI=true
      # Web UI credentials (can be commented out for no authentication)
      - UI_USERNAME=${EXPLO_UI_USERNAME:?Set EXPLO_UI_USERNAME in .env}
      - UI_PASSWORD=${EXPLO_UI_PASSWORD:?Set EXPLO_UI_PASSWORD in .env}
