- 󰨛 System:
    - Tailscale: # This starts the actual service card
        icon: /icons/tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Network Status
        widget:
          type: tailscale
          deviceid: <replace-me>
          key: generate a key here: https://console.tailscale.com/admin/settings/keys 
          fields: ["hostname", "last_seen", "os", "expires"]
    - Beszel:
        icon: beszel
        href: http://100.x.x.x:8090
        description: System Monitoring
        widget:
          type: beszel
          url: http://100.x.x.x:8090
          username: anggaragalang307@gmail.com # email
          password: <your-beszel-password>
          systemId: you can find it in here: http://100.x.x.x:8090/system/<this-is-your-systemid> # optional
          version: 2 # optional, default is 1 
          fields: ["status", "cpu", "memory", "network"] 
