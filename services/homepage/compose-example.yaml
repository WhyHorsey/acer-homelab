services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.5.0
    container_name: homepage
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "100.x.x.x:3000,192.168.x.x:3000,acer-server:3000"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./config:/app/config
      - ./images:/app/public/images
      - ./icons:/app/public/icons