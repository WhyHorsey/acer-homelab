services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    user: "1000:1000"
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_BACKUP_PATH: /backup
      ND_BACKUP_SCHEDULE: "0 0 * * *"
      ND_BACKUP_COUNT: "7"
      ND_LOGLEVEL: "debug"
    volumes:
      - ./data:/data
      - /srv/media/music:/music:ro
      - ./backup:/backup
